# Example configuration for bin/feed_monitor.
#
#   ./bin/feed_monitor --config config/feeds.example.conf
#
# Format (see src/config.cpp):
#   * one `key = value` pair per line; `#` or `;` at the start of a line
#     begins a comment; blank lines are ignored
#   * every key before the first [feed] header is a global setting
#   * each [feed] header starts one feed; its id/name/host/port keys follow
#   * a bad line, unknown key or invalid value is reported on stderr and
#     skipped -- it never aborts the rest of the file
# Cross-field rules (checked after loading; a violating set of values is
# reported on stderr and the offending values fall back to the built-in
# defaults -- tick_interval_ms is lowered to fit instead):
#   heartbeat_interval_ms < heartbeat_timeout_ms
#   reconnect_base_delay_ms <= reconnect_max_delay_ms
#   tick_interval_ms <= heartbeat_interval_ms
# Millisecond values must be 1..86400000 (one day); epoll_max_events 1..1000000.
# Command-line flags override this file (CLI > --config file > built-in
# defaults). The values below are the built-in defaults unless noted.

# --- heartbeat timing -------------------------------------------------------
# How often the monitor sends a PING to each feed.
heartbeat_interval_ms = 1000
# A PONG that has not arrived this long after its PING counts as a miss.
heartbeat_timeout_ms = 3000
# Consecutive misses before a feed goes FAILED (after one miss it is DEGRADED).
max_missed_heartbeats = 3

# --- reconnect backoff ------------------------------------------------------
# Exponential backoff between reconnect attempts, capped at the max.
reconnect_base_delay_ms = 500
reconnect_max_delay_ms = 30000
# -1 = retry forever.
max_reconnect_attempts = -1

# --- reactor / socket tuning ------------------------------------------------
epoll_max_events = 256
# How often timeouts and heartbeat sends are checked.
tick_interval_ms = 50
# Booleans accept true/false, 1/0, yes/no.
tcp_nodelay = true
edge_triggered = true

# --- feeds ------------------------------------------------------------------
# host must be a numeric IPv4 literal (no hostnames / DNS, no IPv6).
# id must be unique, 0..4294967295; port 1..65535. The peer must speak the
# heartbeat protocol with the same feed id -- e.g. start two local simulators:
#   ./bin/feed_simulator --port 9001 --feed-id 1
#   ./bin/feed_simulator --port 9002 --feed-id 2

[feed]
id = 1
name = NYSE-PRIMARY
host = 127.0.0.1
port = 9001

[feed]
id = 2
name = NASDAQ-BACKUP
host = 127.0.0.1
port = 9002
